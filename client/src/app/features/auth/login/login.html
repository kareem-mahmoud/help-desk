<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <a class="brand" routerLink="/register" aria-label="Help Desk registration">
      <img class="brand-mark" src="/helpdesk-mark.svg?v=6" alt="" aria-hidden="true" />
      <span>helpdesk<span class="brand-period">.</span></span>
    </a>
    @if (justRegistered) {
      <div class="success-note" role="status">Your account has been created successfully.</div>
    }
    <span class="eyebrow">WELCOME BACK</span>
    <h1 id="login-title">Log in</h1>
    <p>Sign-in is the next step. Your Help Desk account is ready.</p>
    <a class="back-link" routerLink="/register">Back to registration</a>
  </section>
</main>
