<main class="auth-page">
  <header class="auth-header">
    <div class="auth-brand" aria-label="Help Desk">
      <img class="auth-brand-mark" src="/helpdesk-mark.svg?v=6" alt="" aria-hidden="true" />
      <span>helpdesk<span class="brand-period">.</span></span>
    </div>
  </header>

  <div class="auth-content" [class.split]="split()">
    <ng-content select="[auth-aside]"></ng-content>
    <section class="auth-card">
      <ng-content></ng-content>
    </section>
  </div>
</main>
